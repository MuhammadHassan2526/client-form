<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Client Evaluation Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a one-column phone form like a site-office carbon copy; yellow marks every field to fill, a rubber stamp marks approval. */
:root{
  --bg:#eef2f0;--surface:#ffffff;--ink:#14231f;--muted:#566863;--line:#cfd9d5;
  --accent:#0b5d4e;--accent-ink:#ffffff;--accent-soft:#dcece7;--input:#fff8d2;--input-line:#d9c766;
  --hot:#b3361e;--hot-soft:#fbe5df;--warm:#8a5a00;--warm-soft:#fbeecb;--cold:#28598f;--cold-soft:#e0ebf7;
  --ok:#0b6b45;--ok-soft:#dbf1e6;--err:#b3261e;
  --font:Candara,"Cabin","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101715;--surface:#18221f;--ink:#e6efec;--muted:#9db0aa;--line:#31403b;
  --accent:#4cc3a8;--accent-ink:#06211b;--accent-soft:#1c3a33;--input:#2f2b12;--input-line:#6d6222;
  --hot:#f39a84;--hot-soft:#46211a;--warm:#e7bd62;--warm-soft:#3d2f10;--cold:#8fbdf0;--cold-soft:#1b2f47;
  --ok:#6fd8a8;--ok-soft:#163528;--err:#f2958d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715;--surface:#18221f;--ink:#e6efec;--muted:#9db0aa;--line:#31403b;
  --accent:#4cc3a8;--accent-ink:#06211b;--accent-soft:#1c3a33;--input:#2f2b12;--input-line:#6d6222;
  --hot:#f39a84;--hot-soft:#46211a;--warm:#e7bd62;--warm-soft:#3d2f10;--cold:#8fbdf0;--cold-soft:#1b2f47;
  --ok:#6fd8a8;--ok-soft:#163528;--err:#f2958d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding:70px 0 90px}
body{background:var(--bg);color:var(--ink);font:11pt/1.45 var(--font);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
h1{font-size:1.15rem;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:.8rem;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
main{display:grid;gap:14px;padding-block:14px}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px;min-width:0}
.muted{color:var(--muted)}.small{font-size:.87rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.login{max-width:420px;margin:8vh auto 0}
.mono{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:46px;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-align:left}
.rolebtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;font-size:.85rem;font-weight:600;white-space:nowrap}
.field{display:grid;gap:5px;min-width:0}
.field>label,.field>.lab{font-weight:600;font-size:.94rem}
.req{color:var(--err)}
.hint{font-size:.84rem;color:var(--muted)}
.err{color:var(--err);font-size:.87rem;font-weight:600}
input[type=password],input[type=text],input[type=tel],input[type=email],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--input-line);border-radius:6px;background:var(--input);color:var(--ink);font:inherit;font-size:16px;min-width:0}
input[type=search],select.filter{background:var(--surface);border-color:var(--line)}
textarea{min-height:84px;resize:vertical}
.invalid input,.invalid select,.invalid textarea{border-color:var(--err);border-width:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:flex;align-items:center;min-height:42px;padding:8px 12px;border:1px solid var(--input-line);border-radius:6px;background:var(--input);font-size:.94rem}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.more{border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:40px;display:flex;align-items:center}
.more[open] summary{margin-bottom:10px}
.why{display:grid;gap:6px;padding-top:8px}
.whyrow{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}.whyrow .hint{display:block}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.steps button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-size:.85rem;white-space:nowrap}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.scorerow{display:grid;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.scorerow:first-child{border-top:0;padding-top:0}
.scorerow .chips{display:grid;grid-template-columns:repeat(5,1fr)}
.scorerow .chip span{justify-content:center;font-variant-numeric:tabular-nums;padding:8px 0}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.total b{font-size:1.5rem}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:.78rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.p-Hot,.p-rejected{background:var(--hot-soft);color:var(--hot)}
.p-Warm,.p-hold,.p-pending{background:var(--warm-soft);color:var(--warm)}
.p-Cold{background:var(--cold-soft);color:var(--cold)}
.p-approved,.p-Booked{background:var(--ok-soft);color:var(--ok)}
.p-prospect{background:var(--cold-soft);color:var(--cold)}.p-converted{background:var(--ok-soft);color:var(--ok)}.p-overdue{background:var(--hot-soft);color:var(--hot)}
.p-none{background:var(--bg);color:var(--muted)}
.item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.item .name{font-weight:700;overflow-wrap:anywhere}
.list{display:grid;gap:8px}
dl{margin:0;display:grid;gap:8px}
dl>div{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
dl>div:last-child{border-bottom:0;padding-bottom:0}
dt{color:var(--muted);font-size:.88rem}dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:.82rem;color:var(--muted)}
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.filters>:first-child{grid-column:1/-1}
.note{padding:10px 12px;border-radius:6px;background:var(--warm-soft);color:var(--ink);font-size:.92rem}
.note.bad{background:var(--hot-soft)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.stamp{justify-self:start;transform:rotate(-3deg);border:3px double var(--ok);color:var(--ok);padding:6px 12px;border-radius:4px;display:grid;line-height:1.25}
.stamp b{font-size:1.05rem;letter-spacing:.14em}.stamp span{font-size:.8rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1 1 0;min-width:0;min-height:58px;background:none;border:0;border-top:3px solid transparent;font-size:.8rem;font-weight:600;color:var(--muted);padding:6px 2px}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--hot);color:var(--surface);font-size:.72rem;line-height:18px;margin-left:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:6px;font-weight:600;max-width:min(92vw,520px)}
@media (prefers-reduced-motion:no-preference){.card,.item{transition:border-color .12s}}
</style>
</head><body>
<header class="top"><div class="wrap gut">
  <h1>Client Evaluation Form</h1>
  <button class="rolebtn" id="rolebtn" type="button">Sales Executive</button>
</div></header>
<div class="wrap gut"><main id="view"></main></div>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const API="https://script.google.com/macros/s/AKfycbyDOtxqJ1Esh2L5eDi5rSrv3bw0iUfhvGlbrvdiiCH73O8s4CuO93X_hdMNHL44IRf6uA/exec";
async function api(a,p){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a,code:S.code,token:S.token,...(p||{})})});
 const j=await r.json();if(!j.ok){const e=new Error(j.error);e.server=j.error;throw e}return j}
const $=(s,r=document)=>r.querySelector(s);
function h(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(v==null||v===false)continue;
  if(n==="class")e.className=v;else if(n.startsWith("on"))e.addEventListener(n.slice(2),v);else if(n==="value"||n==="checked"||n==="disabled"||n==="hidden"||n==="selected")e[n]=v;else e.setAttribute(n,v===true?"":v)}
  k.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:String(c))});return e}
const words=n=>{const v=Number(n)||0;if(!v)return"";const t=x=>String(Math.round(x*100)/100);return"PKR "+v.toLocaleString("en-US")+(v>=1e7?" ("+t(v/1e7)+" crore)":v>=1e5?" ("+t(v/1e5)+" lakh)":"")};
const money=n=>{const v=Number(String(n||"").replace(/[^\d.]/g,""));return v?"PKR "+v.toLocaleString("en-US"):""};
const fmtDate=s=>{if(!s)return"";const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
const fmtDT=s=>{if(!s)return"";const d=new Date(s);return isNaN(d)?s:d.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})};
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
const yn=["Yes","No"];

/* ---------- the form, as data ---------- */
const CRITERIA=[
 ["s_fin","Financial capacity","Budget and down payment match the unit price"],
 ["s_intent","Buying intent","Client is serious, not only comparing prices"],
 ["s_urgency","Urgency","Client has a clear booking timeline"],
 ["s_auth","Decision authority","Decision maker is involved"],
 ["s_fit","Unit fit","Available unit meets the requirement"],
 ["s_docs","Document readiness","CNIC and payment documents can be provided"]];
const isRef=d=>/customer|Employee|Corporate|Friend|agent/i.test(d.leadSource||"");
const LEAD={Direct:["Walk-in","Inbound call","Sales team cold call"],Digital:["Facebook","Instagram","Google / website","Property portal","WhatsApp campaign"],Offline:["Site hoarding / billboard","Newspaper / TV","Flyer / SMS","Exhibition / expo"],Referral:["Existing customer","Employee","Corporate tie-up","Friend / family"],Agent:["Real estate agent / dealer"]};
const yes=(d,k)=>d[k]==="Yes";
const notReady=d=>d.visitOutcome==="Needs time"||d.visitOutcome==="Not interested in this project";
const inDays=n=>{const t=new Date(Date.now()+n*864e5),p=x=>String(x).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())};
const SECTIONS=[
{id:"client",title:"Client",fields:[
 {k:"project",l:"Project",t:"project",req:1},
 {k:"name",l:"Client name",req:1},
 {k:"mobile",l:"Mobile no.",t:"tel",req:1,note:d=>{const k=digits(d.mobile);if(k.length<10)return"";const m=myForms().find(x=>x.fid!==S.F.fid&&x.summary?.mobileKey===k);return m?"You already sent this client: "+m.fid+" ("+STATUS[m.status]+").":""}},
 {k:"occupation",l:"Occupation",t:"radio",req:1,o:["Salaried","Business","Professional","Other"]},
 {k:"occupationOther",l:"Other occupation",when:d=>d.occupation==="Other",req:1},
 {k:"address",l:"Address",t:"area",req:1},
 {k:"leadChannel",l:"How did this client reach us?",t:"radio",req:1,o:Object.keys(LEAD),rerender:1,onset:d=>{const o=LEAD[d.leadChannel];d.leadSource=o.length===1?o[0]:""}},
 {k:"leadSource",l:"Lead source",t:"radio",req:1,o:d=>LEAD[d.leadChannel]||[],when:d=>d.leadChannel&&LEAD[d.leadChannel].length>1},
 {k:"refName",l:"Referrer / agent name",when:isRef},
 {k:"refContact",l:"Referrer / agent contact",t:"tel",when:isRef},
 {k:"agency",l:"Agency name",when:d=>d.leadChannel==="Agent"},
 {k:"commission",l:"Commission applicable?",t:"radio",o:yn,when:isRef},
 {k:"cnic",l:"CNIC / passport no.",t:"cnic",more:1,hint:"CNIC format: 42101-1234567-1"},
 {k:"city",l:"City",req:1,more:1},
 {k:"relation",l:"Father's / husband's name",more:1},
 {k:"clientType",l:"Client type",t:"radio",o:["Resident","Overseas Pakistani","Foreign national"],more:1},
 {k:"employer",l:"Employer / business name",more:1},{k:"designation",l:"Designation",more:1,when:d=>d.occupation!=="Business"},
 {k:"existing",l:"Existing Gohar customer?",t:"radio",o:yn,more:1},
 {k:"whatsapp",l:"WhatsApp no. (if different)",t:"tel",more:1},{k:"altPhone",l:"Alternate contact no.",t:"tel",more:1},
 {k:"email",l:"Email",t:"email",more:1},{k:"officeAddress",l:"Office address",t:"area",more:1},{k:"bestTime",l:"Best time to contact",more:1},
 {k:"campaign",l:"Campaign name",more:1,when:d=>d.leadChannel==="Digital"||d.leadChannel==="Offline"},{k:"firstContact",l:"Date of first contact",t:"date",more:1},
 {k:"seName",l:"Sales Executive",req:1,more:1},{k:"empId",l:"Employee ID",more:1},{k:"site",l:"Site / sales office",more:1}]},
{id:"unit",title:"Unit and budget",fields:[
 {k:"unitType",l:"Unit type",t:"radio",req:1,o:["Apartment","Penthouse","Shop","Office","Plot"]},
 {k:"unitNo",l:"Unit no. offered",req:1},
 {k:"price",l:"Quoted price (PKR)",t:"money",req:1},
 {k:"budget",l:"Client's total budget (PKR)",t:"money",req:1,note:d=>{const p=+d.price,b=+d.budget;if(!p||!b)return"";return b>=p?"Budget covers the quoted price.":"Budget is "+Math.round((1-b/p)*100)+"% below the quoted price."}},
 {k:"mode",l:"Payment mode",t:"radio",req:1,o:["Full payment","Installments","Bank financing"]},
 {k:"down",l:"Down payment available (PKR)",t:"money",when:d=>d.mode&&d.mode!=="Full payment"},
 {k:"monthly",l:"Monthly installment capacity (PKR)",t:"money",when:d=>d.mode==="Installments"},
 {k:"bedrooms",l:"Bedrooms",t:"num",more:1,when:d=>d.unitType==="Apartment"||d.unitType==="Penthouse"},
 {k:"purpose",l:"Purpose of purchase",t:"radio",o:["Own use","Investment","Rental income","Business use"],more:1},
 {k:"tower",l:"Tower / block",more:1},{k:"unitSize",l:"Unit size (sq. ft)",t:"num",more:1},{k:"sizeReq",l:"Size required (sq. ft)",t:"num",more:1},
 {k:"floorPref",l:"Floor / facing preference",more:1},{k:"altUnit",l:"Alternate unit no.",more:1},{k:"otherProjects",l:"Other projects considered",more:1},
 {k:"special",l:"Special request / discount asked",t:"area",more:1},
 {k:"funds",l:"Source of funds",t:"radio",o:["Salary","Business","Savings","Property sale","Overseas remittance","Other"],more:1},
 {k:"fundsOther",l:"Other source of funds",when:d=>d.funds==="Other",more:1},
 {k:"tax",l:"Tax status",t:"radio",o:["Filer","Non-filer","Not known"],more:1}]},
{id:"signals",title:"Buying signals",fields:[
 {k:"visitOutcome",l:"Result of this visit",t:"radio",req:1,rerender:1,o:["Ready to proceed","Needs time","Not interested in this project"],onset:d=>{if(notReady(d)&&!d.nextFollowUp)d.nextFollowUp=inDays(14)}},
 {k:"reasons",l:"What is holding the client back?",t:"multi",o:["Price","Location","Unit size","Payment plan","Timing","Family decision","Other"],when:notReady},
 {k:"nextFollowUp",l:"Next follow-up date",t:"date",req:1,when:notReady},
 {k:"openOther",l:"Open to other or future projects?",t:"radio",req:1,rerender:1,o:yn,when:notReady},
 {k:"prefArea",l:"Preferred area / location",when:d=>notReady(d)&&yes(d,"openOther")},
 {k:"visited",l:"Site visited?",t:"radio",req:1,o:yn},
 {k:"visits",l:"No. of visits",t:"radio",o:["1","2","3+"],when:d=>yes(d,"visited")},
 {k:"expected",l:"Expected booking",t:"radio",req:1,o:["Within 7 days","Within 30 days","Within 90 days","Later"],when:d=>d.visitOutcome!=="Not interested in this project"},
 {k:"decisionMaker",l:"Who decides?",t:"radio",req:1,o:["Client","Spouse","Family","Business partner"]},
 {k:"dmMet",l:"Decision maker met?",t:"radio",req:1,o:yn,when:d=>d.decisionMaker&&d.decisionMaker!=="Client"},
 {k:"token",l:"Ready to pay token?",t:"radio",req:1,o:yn},
 {k:"tokenAmt",l:"Token amount (PKR)",t:"money",when:d=>yes(d,"token")},
 {k:"fit",l:"Does this unit match the requirement?",t:"radio",req:1,o:["Exact match","Close match","Not a good match"]},
 {k:"scores",l:"Client score",t:"score"},
 {k:"docs",l:"Documents collected",t:"multi",o:["CNIC copy","Visiting card","Unit quotation","Payment plan"],more:1},
 {k:"seRemarks",l:"Sales Executive remarks",t:"area",more:1},
 {k:"objections",l:"Client's objections / concerns",t:"area",more:1},{k:"liked",l:"What the client liked",t:"area",more:1},
 {k:"visitDate",l:"Latest visit date",t:"date",when:d=>yes(d,"visited"),more:1},{k:"accompanied",l:"Accompanied by",when:d=>yes(d,"visited"),more:1},
 {k:"hoVisit",l:"Proposed Head Office visit",t:"datetime",more:1}]}];
function autoScores(d){const p=+d.price||0,b=+d.budget||0,r=p?b/p:0,vis=parseInt(d.visits)||0,n=(d.docs||[]).length;
 const out={};
 out.s_fin=[!p||!b?1:r>=1?5:r>=.9?4:r>=.75?3:r>=.5?2:1,!p||!b?"Enter price and budget":r>=1?"Budget covers the price":"Budget is "+Math.round(r*100)+"% of the price"];
 out.s_intent=[1+(yes(d,"token")?2:0)+(yes(d,"visited")?1:0)+(vis>=2?1:0),[yes(d,"token")&&"token ready",yes(d,"visited")&&"site visited",vis>=2&&"repeat visit"].filter(Boolean).join(", ")||"No token or visit yet"];
 out.s_urgency=[{"Within 7 days":5,"Within 30 days":4,"Within 90 days":2,"Later":1}[d.expected]||1,d.expected||"No booking date yet"];
